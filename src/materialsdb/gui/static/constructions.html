<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>materialsdb constructions</title>
<style>
 body { font-family: sans-serif; margin: 1rem; }
 .top-tabs { display:flex; gap:.5rem; margin-bottom:.75rem; border-bottom:2px solid #ccc; }
 .top-tabs a { padding:.4rem .9rem; text-decoration:none; color:#333; border-bottom:2px solid transparent; margin-bottom:-2px; }
 .top-tabs a.active { border-bottom-color:#06c; font-weight:bold; color:#06c; }
 table { border-collapse: collapse; margin-top: .5rem; }
 th, td { border: 1px solid #ccc; padding: .25rem .5rem; text-align: left; }
 input, select { margin-right: .5rem; }
 button { margin: .5rem .25rem 0 0; }
 dl dt { font-weight: bold; margin-top: .4rem; }
 dl dd { margin: 0 0 .3rem 0; }
 #status { color: #06c; min-height: 1.2em; }
 .stackbar { display: flex; height: 46px; border: 1px solid #999; margin: .3rem 0; }
 .stackbar-seg { display: flex; align-items: center; justify-content: center;
                 font-size: .72rem; text-align: center; border-right: 1px solid #fff; overflow: hidden; }
 .rs-chip { font-size: .75rem; background: #eef; padding: .1rem .5rem; border-radius: 4px; }
 tr.rsrow td { background: #f4f4f8; font-style: italic; }
 .warn { color: #b60; font-weight: bold; cursor: help; }
 .label { font-size: .7rem; text-transform: uppercase; color: #666; margin-top: .4rem; }
</style>
</head>
<body>
<nav class="top-tabs"><a href="/">Materials</a><a href="/constructions.html" class="active">Constructions</a><a href="#" id="settings-tab">Settings</a></nav>
<div id="settings-panel" style="display:none;padding:.5rem;border:1px solid #ccc;margin-bottom:.5rem">
  <label>Language <select id="lang"><option value="en">en</option><option value="fr">fr</option><option value="de">de</option></select></label>
  <label>Country <select id="country"><option value="CH">CH</option><option value="FR">FR</option></select></label>
</div>
<div style="display:flex;gap:1rem;margin:1rem;height:calc(100vh - 2rem)">
 <div id="saved" style="width:15rem;border-right:1px solid #ccc;padding-right:.6rem;overflow:auto">
  <h3>Constructions</h3>
  <ul id="saved-list" style="list-style:none;padding:0"></ul>
  <button id="new">new</button><button id="delete">delete</button>
  <hr>
  <div class="label">materialsdb (read-only)</div>
  <input id="mdb-search" placeholder="search…" style="width:95%">
  <select id="mdb-company" style="width:95%;margin-top:.25rem"><option value="">all companies</option></select>
  <ul id="mdb-list" style="list-style:none;padding:0;font-size:.85rem"></ul>
  </div>
  <div id="editor" style="flex:2;display:flex;flex-direction:column">
   <div id="readonly-ui" style="display:none"></div>
   <div id="composer-ui" style="display:flex;flex-direction:column;flex:1">
   <div>
    <input id="name" placeholder="construction name">
    <select id="design-usage">
     <option value="">generic</option>
     <option value="consDesignForWall">wall</option>
     <option value="consDesignForRoof">roof</option>
     <option value="consDesignForFloor">floor</option>
    </select>
    <button id="add-layer">add layer</button>
   </div>
   <div id="preview" style="margin-top:.5rem"></div>
   <table><thead><tr>
     <th>#</th><th>material</th><th>thickness mm</th><th>lambda</th><th>r m2K/W</th><th></th>
   </tr></thead><tbody id="layers"></tbody></table>
   <div style="margin-top:.35rem">
    <button data-move="up">↑ up</button><button data-move="down">↓ down</button>
    <button id="reverse">↕ reverse</button>
    <button data-action="remove">remove selected</button>
   </div>
   </div>
  </div>
 <div id="ucard" style="width:16rem;border-left:1px solid #ccc;padding-left:.6rem">
  <h3>U-value</h3>
  <select id="preset"><option>ISO6946</option><option>SIA180</option></select>
  <div id="u-display" style="font-size:1.6rem">-</div>
  <div id="formula-line"
       title="U [W/m²K]: thermal transmittance of the construction&#10;Rsi [m²K/W]: interior surface resistance (from the selected preset)&#10;dᵢ [m]: thickness of layer i&#10;λᵢ [W/(m·K)]: thermal conductivity of layer i&#10;Rse [m²K/W]: exterior surface resistance (from the selected preset)&#10;Layers without a lambda value are excluded and listed as warnings."
       style="font-size:.72rem;color:#555;cursor:help;margin-top:.2rem">
   U = 1/(Rsi + Σ dᵢ/λᵢ + Rse)
  </div>

  <div class="label" style="margin-top:.3rem">LAYERS</div>
  <dl id="contributions"></dl>
  <div id="warnings" style="color:#b60"></div>
  <hr>
  <button id="save">save</button>
  <button id="export-ifc">export .ifc</button>
  <button id="append-session">append to session</button>
  <p id="status"></p>
 </div>
</div>
<script>window.MATERIALSDB_TOKEN = "__TOKEN__";</script>
<script src="/picker-core.js"></script>
<script src="/app-constructions.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>materialsdb settings</title>
<style>
 body { font-family: sans-serif; margin: 1rem; }
 .top-tabs { display:flex; gap:.5rem; margin-bottom:.75rem; border-bottom:2px solid #ccc; }
 .top-tabs a { padding:.4rem .9rem; text-decoration:none; color:#333; border-bottom:2px solid transparent; margin-bottom:-2px; }
 .top-tabs a.active { border-bottom-color:#06c; font-weight:bold; color:#06c; }
 h3 { margin: 1rem 0 .4rem; }
 section { max-width: 52rem; }
 label { display: block; margin-top: .5rem; }
 input, select { margin-right: .5rem; }
 button { margin: .5rem .25rem 0 0; }
 #apply-status, #editor-status { color: #06c; min-height: 1.2em; }
 #scheme-list { list-style: none; padding: 0; margin: .3rem 0; }
 #scheme-list li { padding: .15rem .4rem; border: 1px solid transparent; cursor: pointer; }
 #scheme-list li:hover { background: #f4f4f8; }
 #scheme-list li.selected { background: #eef; border-color: #99c; font-weight: bold; }
 #scheme-list li .builtin { color: #888; font-size: .75rem; font-weight: normal; margin-left: .4rem; }
 #palette-rows { display: grid; grid-template-columns: minmax(10rem, 1fr) auto auto; gap: .2rem .5rem; align-items: center; margin: .6rem 0; }
 #preview-chips { margin-top: .5rem; }
 .chip { display: inline-block; padding: .1rem .5rem; margin: 0 .25rem .25rem 0; border-radius: 3px;
         border: 1px solid rgba(0,0,0,.25); font-size: .78rem; }
 #preview-section { display: flex; height: 42px; border: 1px solid #999; margin: .35rem 0; max-width: 26rem; }
 #preview-section div { flex: 1; }
 #palette-actions { display: flex; flex-wrap: wrap; gap: .25rem; margin: .5rem 0; }
 #palette-actions button { margin: 0; }
 .hint { color: #777; font-size: .78rem; }
</style>
</head>
<body>
<nav class="top-tabs"><a href="/">Materials</a><a href="/constructions.html">Constructions</a><a href="/settings.html" class="active">Settings</a></nav>

<h3>General</h3>
<section id="general-section">
 <label>Language <select id="lang"><option value="en">en</option><option value="fr">fr</option><option value="de">de</option></select></label>
 <label>Country <select id="country"><option value="CH">CH</option><option value="FR">FR</option></select></label>
</section>

<h3>Colour scheme</h3>
<section id="scheme-section">
 <label>Scheme <select id="scheme"></select></label>
 <label id="model-target-row" style="display:none">Target model <select id="model-target" style="display:none"></select></label>
 <label><input type="checkbox" id="ignore-producer-color"> ignore producer colour when restyling</label>
 <button id="apply-colours" disabled>apply colours to model</button>
 <span id="apply-hint" class="hint" style="display:none">no model connected — open the model and use Materials/Constructions first</span>
 <p id="apply-status"></p>
</section>

<h3>Palettes</h3>
<section id="palette-section">
 <ul id="scheme-list"></ul>
 <label>Scheme name <input id="scheme-name" placeholder="palette name"></label>
 <div id="palette-actions">
  <button id="save-scheme" disabled>save</button>
  <button id="save-as-scheme" disabled>save as…</button>
  <button id="delete-scheme" disabled>delete</button>
  <button id="export-scheme" disabled>export…</button>
  <button id="import-scheme">import…</button>
 </div>
 <input type="file" id="import-file" accept="application/json,.json" style="display:none">
 <label id="import-name-label" style="display:none">Import as <input id="import-name" placeholder="scheme name"></label>
 <div id="palette-rows"></div>
 <div id="preview-chips"></div>
 <div id="preview-section"></div>
 <p id="editor-status"></p>
</section>

<script>window.MATERIALSDB_TOKEN = "__TOKEN__";</script>
<script src="/settings.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>materialsdb picker</title>
<style>
 body { font-family: sans-serif; margin: 1rem; display: flex; flex-wrap: wrap; gap: 1rem; }
 .top-tabs { display:flex; gap:.5rem; width:100%; margin-bottom:.5rem; border-bottom:2px solid #ccc; }
 .top-tabs a { padding:.4rem .9rem; text-decoration:none; color:#333; border-bottom:2px solid transparent; margin-bottom:-2px; }
 .top-tabs a.active { border-bottom-color:#06c; font-weight:bold; color:#06c; }
 #left { flex: 3; } #right { flex: 2; }
 table { border-collapse: collapse; width: 100%; }
 th, td { border: 1px solid #ccc; padding: .25rem .5rem; text-align: left; cursor: pointer; }
 tr.selected { background: #eef; }
 aside { position: sticky; top: 1rem; }
 dl dt { font-weight: bold; margin-top: .4rem; }
 label { display: block; margin-top: .5rem; }
 input, select { margin-right: .5rem; }
 button { margin: .5rem .25rem 0 0; }
 #status { color: #06c; min-height: 1.2em; }
 .facet { position:absolute; background:#fff; border:1px solid #999; padding:.35rem; z-index:5; max-height:14rem; overflow:auto; }
 thead th { position: relative; }
 tr.layerrow td { padding-left: 2rem; color: #555; background: #fafcff; }
 #drawer { border-top: 2px solid #99c; padding: .5rem; background: #fdfdff; }
 .stackbar { display: flex; height: 44px; border: 1px solid #999; margin: .3rem 0; }
 #model-changes { color:#a33; background:#fff3f3; border:1px solid #a33; border-radius:3px; padding:.1rem .4rem; }
 .model-badge { font-size:.72rem; padding:.05rem .35rem; border-radius:3px; margin-left:.35rem; background:#eee; color:#333; }
 .model-badge[data-status="changed"] { background:#fff3f3; color:#a33; border:1px solid #a33; }
 .model-badge[data-status="unknown"] { background:#fffbe6; color:#8a6d00; border:1px solid #d6b656; }
 .model-badge[data-status="gone"] { background:#f3f3f3; color:#666; border:1px solid #999; }
 #change-report { border:1px solid #99c; background:#fdfdff; padding:.5rem; margin:.4rem 0; }
 #change-report table { width:auto; }
 #change-report td { border:none; padding:.1rem .4rem; }
 .change-unavailable { color:#888; font-style:italic; }
</style>
</head>
<body>
<nav class="top-tabs"><a href="/" class="active">Materials</a><a href="/constructions.html">Constructions</a><a href="/settings.html">Settings</a></nav>
<div id="left">
 <div>
   <input id="text" placeholder="live search…" style="min-width:16rem">
  <button id="export">export .ifc</button>
  <button id="open">open session…</button>
  <button id="pick">append selected</button>
  <label style="display:inline">replace <input type="checkbox" id="replace"></label>
  <button id="save">save session</button>
  <button id="refresh">refresh cache</button>
  <button id="force-update" disabled>force update used materials</button>
  <span id="updates" style="display:none;color:#a33;background:#fff3f3;border:1px solid #a33;border-radius:3px;padding:.1rem .4rem">newer data available on materialsdb.org — refresh when convenient</span>
  <span id="model-changes" style="display:none"></span>
  <button id="send-bonsai" disabled>send to:</button>
  <select id="bonsai-target" style="display:none"></select>
 </div>
 <p id="status"></p>
 <p id="hint" style="display:none;color:#888;margin:.2rem 0"></p>
 <div id="force-panel" style="display:none;border:1px solid #99c;background:#fdfdff;padding:.5rem;margin:.4rem 0"></div>
 <div id="change-report" style="display:none"></div>
 <table><thead><tr id="header-row"></tr></thead>
 <tbody id="rows"></tbody></table>
</div>
<aside id="right"><h3>detail <button id="preview" style="display:none;float:right">preview stack</button></h3><dl id="detail"></dl></aside>
<div id="drawer" style="display:none;flex-basis:100%"></div>
<script>window.MATERIALSDB_TOKEN = "__TOKEN__";</script>
<script src="/picker-core.js"></script>
<script src="/app.js"></script>
</body>
</html>
